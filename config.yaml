# Game Server Configuration

greeting:
  message: "Hello, world!"       # Configurable string returned by greeter::get_greeting()

logging:
  level: "info"                  # trace, debug, info, warning, error
  file: "logs/game-server.log"

database:
  # libpq conninfo string or URI. Keep credentials out of VCS for real deployments.
  url: "postgresql://postgres:postgres@localhost:5432/game?sslmode=disable"

network:
  port: 7777                     # WebSocket listen port (ws:// — TLS comes later)
  max_connections: 10000         # soft cap; connections beyond this are closed with 1013

auth:
  backend: "postgres"             # "postgres" (default) or "memory" (dev / no-DB testing)
  session_ttl_days: 30            # token lifetime (sliding — extended on every authenticated packet)
  handshake_timeout_sec: 10       # disconnect unauthenticated clients idle this long
  sweeper_interval_sec: 600       # how often the background thread prunes expired sessions
  session_touch_interval_sec: 300 # minimum gap between DB writes for the same token's last_seen_at
  token_cache:
    ttl_sec: 600                  # how long a session entry stays cached before refetching from the store
  rate_limit:
    ip_bucket_cap: 10             # token bucket for Register+Login per IP (Resume is exempt)
    ip_bucket_refill_sec: 6       # 1 token per N seconds
    per_account_hourly_fails: 20  # per-username login-fail threshold → 1h lockout

sim:
  tick_ms: 250                    # authoritative sim tick period (4 TPS)

world:
  locations_file: "config/locations.yaml"  # YAML graph loaded once at startup; immutable thereafter

chat:
  max_text_bytes: 500             # ChatSay.text byte cap (messages above this are dropped silently)
  local:
    bucket_cap: 5                 # per-(account, Local) token bucket
    refill_per_sec: 1.0
  global:
    bucket_cap: 3                 # per-(account, Global) token bucket; intentionally tighter
    refill_per_sec: 0.2           # 1 token every 5 seconds
